name: Bug 报告
description: 报告可以稳定复现的功能异常
title: '[Bug] '
labels: ['bug', 'needs-triage']
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题
          required: true
        - label: 我没有上传私人视频、项目数据库或包含个人路径的日志
          required: true
  - type: input
    attributes:
      label: 应用版本
      placeholder: 例如 0.1.3
    validations:
      required: true
  - type: input
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 请提供最小、连续、可重复的操作步骤。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 补充信息
      description: 可附脱敏截图、视频编码/分辨率等信息。安全漏洞请勿在此提交。
